# Geradores do experimento. status: seen (treino/val/Teste A) | unseen (Teste B).
# ATENÇÃO: confira versões, licenças e termos de uso antes de gerar em massa.
generators:
  stylegan2:
    family: gan
    status: seen
    kind: stylegan2
    repo_dir: external/stylegan2-ada-pytorch   # git clone NVlabs/stylegan2-ada-pytorch
    # categoria -> caminho/URL do .pkl. PREENCHER após conferir quais checkpoints existem.
    # Se uma categoria não tiver checkpoint, TROQUE a categoria (ou o gerador).
    checkpoints:
      cat: null
      car: null
      horse: null
    truncation_psi: 0.7

  sd15:
    family: diffusion
    status: seen
    kind: diffusers
    model_id: stable-diffusion-v1-5/stable-diffusion-v1-5
    steps: 30
    guidance: 7.5
    height: 512
    width: 512
    disable_safety_checker: true

  biggan:
    family: gan
    status: unseen
    kind: biggan
    model_id: biggan-deep-256
    truncation: 0.5
    classes:             # índices de classe da ImageNet (conferir)
      cat: [281, 282, 283, 285]
      car: [817, 511, 436]
      horse: [339, 603]

  sdxl_turbo:
    family: diffusion
    status: unseen
    kind: diffusers
    model_id: stabilityai/sdxl-turbo
    steps: 1
    guidance: 0.0
    height: 512
    width: 512
    disable_safety_checker: false
