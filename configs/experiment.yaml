# Configuração principal do experimento (escala MVP / TCC-I).
# Para a escala final do TCC-II, aumente n_per_category e seeds.
seed: 42
generators_file: generators.yaml
categories: [cat]            # TCC-I: uma categoria (gatos). TCC-II: cat, car, horse + 2

paths:
  raw: data/raw
  processed: data/processed
  splits: data/splits
  results: results

generation:
  n_per_category: 20        # imagens por gerador e categoria (MVP). Aumente se houver tempo.
  prompt_style: "a realistic photograph"

manual:
  inbox: data/inbox                    # data/inbox/<gerador>/<categoria>/ (imagens baixadas)
  prompts: data/manual/prompts.csv     # lista de prompts a usar em TODOS os geradores
  registry: data/registry.csv          # registro de cada imagem (ferramenta, data, prompt, hash)

real:
  n_per_category: 60        # >= (nº de geradores x generation.n_per_category): 3 x 20
  # Pasta local com as imagens reais, organizada por categoria: data/real_source/<categoria>/
  # (por exemplo, recortes da ImageNet ou do COCO). Ajuste os nomes se necessário.
  source_dir: data/real_source
  sources:
    cat:   [cat]

preprocess:
  size: 224                 # lado final (recorte central quadrado + resize)
  jpeg_quality: 95          # igual para TODAS as imagens
  jpeg_subsampling: 0
  dedup_hamming: 2          # distância máxima (dHash 64 bits) para considerar duplicata

split:
  protocol: fixed           # fixed | logo (leave-one-generator-out)
  ratios: [0.70, 0.15, 0.15]

train:
  pretrained: true
  batch_size: 32
  num_workers: 0           # 0 evita erros no Windows
  phase1: {epochs: 3, lr: 1.0e-3}                 # só a camada final
  phase2: {max_epochs: 20, lr: 1.0e-4, patience: 3}  # layer4 + fc
  hflip: true
  threshold: 0.5
  seeds: [0]                # TCC-II: [0, 1, 2, 3, 4]

eval:
  bootstrap: 1000

robustness:               # teste de sensibilidade (marcas d'água invisíveis, compressão etc.)
  perturbations:
    - {name: original, kind: none}
    - {name: jpeg70, kind: jpeg, value: 70}
    - {name: jpeg50, kind: jpeg, value: 50}
    - {name: blur1, kind: blur, value: 1.0}
    - {name: down50, kind: downscale, value: 0.5}
