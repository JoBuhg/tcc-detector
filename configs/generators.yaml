# Geradores COMERCIAIS GRATUITOS, usados por geração MANUAL (sem código de geração).
# status: seen (treino/validação/Teste A) | unseen (Teste B).
# Caminho A (TCC-I): 3 geradores. Para incluir o Ideogram no TCC-II, acrescente um bloco igual (kind: manual).
# Os nomes abaixo são as pastas em data/inbox/<gerador>/<categoria>/ e data/raw/.
# Confira, antes de gerar, quais ferramentas gratuitas estão disponíveis e seus termos de uso.
# Para voltar aos modelos abertos (Stable Diffusion, StyleGAN2, BigGAN...), use generators_open.yaml.
generators:
  chatgpt:
    family: comercial
    status: seen
    kind: manual
    tool: "ChatGPT (OpenAI), plano gratuito"
  gemini:
    family: comercial
    status: seen
    kind: manual
    tool: "Gemini (Nano Banana), plano gratuito"
  copilot:
    family: comercial
    status: unseen
    kind: manual
    tool: "Microsoft Copilot, gratuito"
